<text x="800.0" y="1561.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">S=start; N=(k==input_count-1); G=(neuron+8&gt;=output_count); L=(layer==2).</text>
<text x="800.0" y="1584.9" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">MAC, N=0: k++. ACTIVATE, G=0: neuron+=8; G=1,L=0: layer++, neuron=0.</text>
<text x="800.0" y="1608.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">ACTIVATE, G=1,L=1: busy=0, done=1. Bias/product memakai sign-extension ke 40-bit.</text>
<text x="800.0" y="1631.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">Global: reset dari semua state; abort/fault/protokol salah → IDLE. Fault sticky sampai reset.</text>
<text x="800.0" y="1655.1" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">Default state ilegal → IDLE, fault=1, error_code=6. Transisi normal hanya setelah prioritas global lolos.</text>
<text x="800.0" y="1678.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">1 = satu clock tanpa syarat. Source: experiments/parallel8/igor_src_policy_core.v</text>
