<text x="200.0" y="350.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400">sync=1</text>
<path d="M493.5291661356648,292.1009923922075 C610,220 790,220 906.4708338643352,292.1009923922075" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660.0" y="229.0" width="80" height="32" fill="white"/>
<text x="700" y="245.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400">sync=0</text>
<path d="M1096.534081807941,297.2631907535377 C1232.5593789009488,222.95223226988622 1232.5593789009488,477.0477677301138 1096.534081807941,402.7368092464623" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1176.5" y="334.0" width="47" height="32" fill="white"/>
<text x="1200.0" y="350.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400">C=0</text>
<path d="M1000.0,460.0 L1000.0,790.0" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="932.5" y="609.0" width="135" height="32" fill="white"/>
<text x="1000.0" y="625.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400">C=1, sync=0</text>
<path d="M910.4893181672592,413.9362013091006 C790,500 610,500 489.51068183274083,413.9362013091006" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="632.5" y="454.0" width="135" height="32" fill="white"/>
<text x="700" y="470.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400">C=1, sync=1</text>
<path d="M1096.534081807941,847.2631907535376 C1232.5593789009488,772.9522322698862 1232.5593789009488,1027.0477677301137 1096.534081807941,952.7368092464624" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1127.0" y="884.0" width="146" height="32" fill="white"/>
<text x="1200.0" y="900.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400">C=0 atau K=0</text>
<path d="M890.0,900.0 L510.0,900.0" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="649.0" y="884.0" width="102" height="32" fill="white"/>
<text x="700.0" y="900.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400">C=1, K=1</text>
<path d="M303.465918192059,952.7368092464624 C167.44062109905124,1027.0477677301137 167.4406210990512,772.9522322698863 303.465918192059,847.2631907535376" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="176.5" y="884.0" width="47" height="32" fill="white"/>
<text x="200.0" y="900.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400">C=0</text>
<path d="M400.0,790.0 L400.0,460.0" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="332.5" y="609.0" width="135" height="32" fill="white"/>
<text x="400.0" y="625.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400">C=1, sync=1</text>
<path d="M491.5255323771628,961.0170215847752 C550,1000 610,530 483.51822626018264,421.5870510801565" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="527.5" y="754.0" width="135" height="32" fill="white"/>
<text x="595" y="770.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400">C=1, sync=0</text>
<text x="700.0" y="1223.2" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">C=(count==0); K=(bit_index==7); sync adalah RX setelah synchronizer dua flop.</text>
<text x="700.0" y="1246.6" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">Saat count!=0: count--. Start sah: index=0. DATA C=1,K=0: sample, index++, reload count.</text>
<text x="700.0" y="1270.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">STOP C=1,sync=1: valid=1,data=shift; STOP C=1,sync=0: error=1. Pulse default 0 tiap clock.</text>
<text x="700.0" y="1293.4" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">Reset/default case → state0. IDLE/START CHECK/DATA/STOP adalah alias kode RTL 0/1/2/3.</text>
<text x="700.0" y="1316.8" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">Semua panah normal pada posedge clk. Source: rtl/igor_uart_rx.v</text>
</svg>