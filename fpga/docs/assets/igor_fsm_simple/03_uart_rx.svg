<rect width="1400" height="1450" fill="white"/>
<text x="700.0" y="52.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700">3. FSM UART RX</text>
<text x="700.0" y="102.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400">Atas: state  |  Bawah: aksi register  |  Panah: kondisi transisi</text>
<circle cx="400" cy="350" r="110" fill="white" stroke="black" stroke-width="2"/>
<path d="M304,350 L496,350" stroke="black" stroke-width="1.5"/>
<text x="400" y="298.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">IDLE (0)</text>
<text x="400" y="397.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400">Tunggu start bit</text>
<circle cx="1000" cy="350" r="110" fill="white" stroke="black" stroke-width="2"/>
<path d="M904,350 L1096,350" stroke="black" stroke-width="1.5"/>
<text x="1000" y="298.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">START CHECK (1)</text>
<text x="1000" y="397.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400">Periksa start bit</text>
<circle cx="1000" cy="900" r="110" fill="white" stroke="black" stroke-width="2"/>
<path d="M904,900 L1096,900" stroke="black" stroke-width="1.5"/>
<text x="1000" y="848.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">DATA (2)</text>
<text x="1000" y="936.6" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400">C=1: shift[bit_index]</text>
<text x="1000" y="957.4" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400">← sync</text>
<circle cx="400" cy="900" r="110" fill="white" stroke="black" stroke-width="2"/>
<path d="M304,900 L496,900" stroke="black" stroke-width="1.5"/>
<text x="400" y="848.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">STOP (3)</text>
<text x="400" y="926.2" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400">C=1: valid / error</text>
<text x="400" y="947.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400">data[7:0] ← shift</text>
<text x="400" y="967.8" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400">jika stop sah</text>
<path d="M400,150 L400.0,240.0" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="424.5" y="179.0" width="91" height="32" fill="white"/>
<text x="470.0" y="195.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400">rst_n=0</text>
<path d="M303.465918192059,402.73680924646237 C167.44062109905124,477.04776773011383 167.4406210990512,222.95223226988622 303.465918192059,297.2631907535377" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
