<text x="1050.0" y="1861.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">A=CRC+domain frame sah; I=(load_index==73); D=core_done; B=tx_busy.</text>
<text x="1050.0" y="1884.9" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">R=(!tx_busy &amp;&amp; !tx_send); F=(tx_index==10). Saat R=1,F=0: tx_index++.</text>
<text x="1050.0" y="1908.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">CAP0/1 memilih output_index berikut; CAP2 menyiapkan CRC dan tx_index=0.</text>
<text x="1050.0" y="1931.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">Global E-stop/reject → RX, core_abort=1, tx_cancel=1, result_valid=0; lihat prioritas RTL.</text>
<text x="1050.0" y="1955.1" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400">Default mode ilegal: reject(10). 1 = satu clock. Pulse register default 0 pada clock berikutnya.</text>
