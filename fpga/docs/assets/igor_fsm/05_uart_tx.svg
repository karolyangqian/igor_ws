<text x="90.00" y="799.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">SOURCE: rtl/igor_uart_tx.v</text>
<text x="90.00" y="825.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: busy=0; shift=10&#x27;h3ff; bit_index=count=0</text>
<text x="90.00" y="851.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. tx=busy ? shift[0] : 1. Tidak ada variabel state eksplisit; diagram memecah fase counter untuk penjelasan.</text>
<text x="90.00" y="877.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. send saat busy diabaikan. Wrapper hanya memberi pulse saat !tx_busy &amp;&amp; !tx_send.</text>
<text x="90.00" y="903.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Reset transmitter dari policy: rst_n &amp;&amp; !estop_active &amp;&amp; !tx_cancel; stop/cancel dapat membatalkan transmisi.</text>
<text x="90.00" y="929.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. Tidak menambahkan default state atau illegal-counter recovery yang tidak tertulis pada source.</text>
