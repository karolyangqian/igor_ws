<text x="90.00" y="933.93" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: KEY0 ditekan -&gt; 00 tanpa menunggu clock</text>
<text x="90.00" y="959.93" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. rst_n=reset_sync[1]. Pelepasan memerlukan dua rising edge, tidak langsung mengikuti tombol.</text>
<text x="90.00" y="985.93" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. Nilai10 akibat gangguan bukan fase normal; operasi shift berikutnya menghasilkan01. Ini bukan klaim proteksi SEU.</text>
<text x="90.00" y="1011.93" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Clock50MHz. Seluruh kontrol menggunakan domain clock yang sama; gambar bukan bukti MTBF/CDC sign-off.</text>
