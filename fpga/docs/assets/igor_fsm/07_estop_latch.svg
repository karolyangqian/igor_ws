<text x="90.00" y="783.52" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">SOURCE: experiments/parallel8/igor_src_policy_de10_nano.v</text>
<text x="90.00" y="809.52" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: stop_latched=0; stop_sync=00</text>
<text x="90.00" y="835.52" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. stop_active = !KEY[1] | stop_sync[1] | stop_latched. Tekanan raw langsung menginhibit tanpa menunggu latch.</text>
<text x="90.00" y="861.52" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. stop_sync &lt;= {stop_sync[0],!KEY[1]}; jalur sampled memakai dua flop. Lepaskan KEY1 lalu reset KEY0 untuk recovery.</text>
<text x="90.00" y="887.52" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Raw stop masih aktif jika KEY1 ditahan saat reset. CLEAR bukan jaminan permit aktif.</text>
<text x="90.00" y="913.52" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. Di policy ada synchronizer estop lagi; estop_active=estop | estop_sync. Jangan menyebut seluruh jalur stop Moore murni.</text>
