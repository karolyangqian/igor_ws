<text x="90.00" y="1151.61" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. Semua kode selain0..6,8,9 masuk default -&gt;7; state7 juga mengikuti default sehingga tersangkut sampai reset.</text>
<text x="90.00" y="1177.61" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. Nama state adalah alias penjelas. Source memakai angka; tidak ada fault latch tambahan pada sequencer demo.</text>
<text x="90.00" y="1203.61" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Ini demo planner terpisah, bukan wrapper Parallel8 UART.</text>
