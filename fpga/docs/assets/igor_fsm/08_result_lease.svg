<text x="90.00" y="795.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: result_valid=0; result_timer=0</text>
<text x="90.00" y="821.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. Timer bertambah ketika result_valid=1. Default RESULT_TIMEOUT_CYCLES=1.000.000 (20ms @50MHz).</text>
<text x="90.00" y="847.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. safety_permit=result_valid &amp;&amp; !estop_active &amp;&amp; !core_fault; core_fault sendiri menutup permit meskipun flag validity belum diubah.</text>
<text x="90.00" y="873.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Action mask kombinasi mengeluarkan0 saat permit0. Residual nol bukan perintah motor nol; host masih bertanggung jawab stop.</text>
<text x="90.00" y="899.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. Pulse response_valid di CAP2 terpisah dari result_valid yang ditahan dan dari selesainya UART TX.</text>
