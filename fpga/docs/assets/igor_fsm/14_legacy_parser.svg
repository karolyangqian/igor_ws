<text x="90.00" y="769.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">SOURCE: rtl/igor_uart_protocol.v</text>
<text x="90.00" y="795.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: pos=0; protocol_fault=0</text>
<text x="90.00" y="821.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. Tanpa rx_valid posisi ditahan kecuali timeout/rx_error. rx saat sending atau respond_delay!=0 -&gt; fault dan pos0.</text>
<text x="90.00" y="847.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. Timeout saat pos!=0 dan timer&gt;=RX_TIMEOUT_CYCLES -&gt; pos0,fault1. rx_error juga mengeset fault dan pos0.</text>
<text x="90.00" y="873.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Source memakai beberapa if berurutan dalam satu always, bukan satu prioritas else-if global: assignment terakhir ke register yang sama menang.</text>
<text x="90.00" y="899.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. Default pos ilegal -&gt; pos0,fault1. protocol_fault sticky; command_valid default0 tiap clock; CRC MSB-first0x07.</text>
<text x="90.00" y="925.58" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">5. Opcode/payload diperiksa lagi oleh igor_uart_top; invalid_command sticky bukan FSM enum.</text>
</svg>