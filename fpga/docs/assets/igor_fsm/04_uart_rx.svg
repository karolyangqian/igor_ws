<text x="90.00" y="799.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">SOURCE: rtl/igor_uart_rx.v</text>
<text x="90.00" y="825.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: state=0; valid=error=0; data=0; meta=sync=1</text>
<text x="90.00" y="851.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. meta/sync adalah dua flop sinkronisasi RX asinkron. Sample dipakai dari sync, bukan langsung rx.</text>
<text x="90.00" y="877.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. valid dan error default0 tiap clock; pulse hanya pada penyelesaian STOP. Default case(state): state=0.</text>
<text x="90.00" y="903.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Pada proyek Parallel8 BIT_CYCLES=(50.000.000+921600/2)/921600=54. Nominal921600, aktual50MHz/54.</text>
<text x="90.00" y="929.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. IDLE/START_CHECK/DATA/STOP adalah alias diagram; RTL memakai angka0..3, bukan enum bernama.</text>
</svg>