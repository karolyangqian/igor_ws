<text x="90.00" y="1360.93" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: delay=0; sending=0; tx_send=0</text>
<text x="90.00" y="1386.93" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. sending=0 bukan bukti UART stop bit terakhir sudah selesai; berbeda dengan TX_START_LAST/TX_END_LAST di policy baru.</text>
<text x="90.00" y="1412.93" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. tx_send default0 tiap clock. Frame LSB-byte-first dari out_frame={A5,response_crc,response_sample,opcode,5A}.</text>
<text x="90.00" y="1438.93" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Diagram mengelompokkan kombinasi counter yang normal; tidak menambah enum atau guard illegal-counter baru.</text>
