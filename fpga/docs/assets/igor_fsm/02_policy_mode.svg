<rect x="70" y="1415.0" width="3000" height="304" rx="14" fill="#F2EDF7" stroke="#C2B1D3"/>
<text x="90.00" y="1445.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">SOURCE: rtl/igor_src_policy/igor_src_policy_uart.v</text>
<text x="90.00" y="1471.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: RX; position=0; hasil/flag/pulse=0</text>
<text x="90.00" y="1497.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. Prioritas: estop &gt; core_fault saat mode!=RX &gt; rx_error &gt; rx_valid saat mode!=RX &gt; infer timeout &gt; inter-byte timeout &gt; stale result &gt; parser + case(mode).</text>
<text x="90.00" y="1523.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. reject(code): mode=RX, position=0, result_valid=0, core_abort=1, tx_cancel=1; counter rejected saturating + history fault.</text>
<text x="90.00" y="1549.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. E-stop: mode=RX; result_valid=0; core_abort=1; tx_cancel=1. Error1 dicatat pada rising event stop, bukan setiap clock.</text>
<text x="90.00" y="1575.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. Default mode ilegal: reject(10). RX parser fault codes: framing2, header3, opcode4, length5, CRC6, timeout7, range8, busy9, core10, stale11, watchdog12.</text>
<text x="90.00" y="1601.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">5. core_load/core_start/core_abort/tx_send/tx_cancel/response_valid diberi default 0 tiap clock; state dapat menjadikannya 1.</text>
<text x="90.00" y="1627.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">6. Nonblocking assignment: LOAD terakhir diterima core pada clock START; core_start dari START diterima core pada clock RUN berikutnya.</text>
<text x="90.00" y="1653.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">7. response_valid pulse pada CAP2, bukan saat stop bit terakhir selesai. safety_permit=result_valid &amp;&amp; !estop_active &amp;&amp; !core_fault.</text>
<text x="90.00" y="1679.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">8. debug_state F saat E-stop dan E saat core_fault adalah overlay debug; bukan tambahan state mode=F/E.</text>
</svg>