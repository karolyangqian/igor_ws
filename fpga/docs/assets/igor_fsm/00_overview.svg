<text x="90.00" y="766.01" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: Lihat halaman FSM; halaman ini adalah struktur/overview.</text>
<text x="90.00" y="792.01" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. Mulai page01 untuk FSM core. Page02..08 mencakup controller pendukung yang aktif pada proyek Parallel8.</text>
<text x="90.00" y="818.01" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. Page09..17 adalah source serial / planner / neural legacy: arsip penjelasan, bukan semuanya terinstansiasi pada Parallel8.</text>
<text x="90.00" y="844.01" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Lingkaran/oval pada halaman FSM = state. Kotak halaman overview/struktur = blok fungsi, bukan enum state.</text>
<text x="90.00" y="870.01" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. Semua transisi memakai clock edge kecuali reset asinkron dan mask stop kombinasi yang disebutkan eksplisit.</text>
<text x="90.00" y="896.01" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">5. Tidak ada modifikasi RTL, bobot, pin, atau SOF dari dokumentasi ini.</text>
