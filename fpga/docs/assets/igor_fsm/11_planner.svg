<text x="90.00" y="825.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: IDLE; flag/control/timer0</text>
<text x="90.00" y="851.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. stop=estop || protective_stop. Default state ilegal -&gt; FAULT, control_fault=1, latched_fault=4.</text>
<text x="90.00" y="877.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. RESULT dapat tetap RESULT saat lease habis; safety gate tetap menutup motor. Jangan menggambar lease selalu mengubah state ke FAULT.</text>
<text x="90.00" y="903.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. busy=(state==RUN), done=(state==RESULT). motor_enable/v/omega berasal dari safety gate kombinasi dengan default output0.</text>
<text x="90.00" y="929.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. FAULT tidak pulih oleh start; perlu reset. Fault fisik aktif tetap punya prioritas live di fault_code.</text>
