<text x="90.00" y="851.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. Prioritas !rst_n &gt; abort_run &gt; case(state). abort_run -&gt; IDLE, done=best_valid=0.</text>
<text x="90.00" y="877.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. Default ilegal -&gt; IDLE, done=best_valid=0, arithmetic_fault=1. Tidak ada state FAULT lokal.</text>
<text x="90.00" y="903.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. HORIZON default20. Masing-masing tile mengerjakan128 index dengan langkah4; empat tile mencakup512 kandidat.</text>
<text x="90.00" y="929.27" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. done ditahan di IDLE sampai start/reset/abort, bukan otomatis pulse satu clock.</text>
