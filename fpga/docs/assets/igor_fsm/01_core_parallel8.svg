<text x="90.00" y="1445.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">SOURCE: experiments/parallel8/igor_src_policy_core.v</text>
<text x="90.00" y="1471.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: IDLE; semua flag/counter utama=0</text>
<text x="90.00" y="1497.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. Prioritas sebelum case: !rst_n &gt; abort &gt; fault tersimpan &gt; protokol load/start tidak sah &gt; case(state).</text>
<text x="90.00" y="1523.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. Abort: state=IDLE, loaded=0, busy=done=0, actions=0; fault sticky tidak dihapus. Fault hanya dihapus reset.</text>
<text x="90.00" y="1549.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Pelanggaran: input_index&gt;=74: code1; load saat busy:2; start saat busy:3; input belum lengkap:4; load+start:5 (sesuai prioritas if).</text>
<text x="90.00" y="1575.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. Default state ilegal: IDLE, busy=done=0, loaded=0, fault=1, error_code=6. Tidak ada state FAULT terpisah.</text>
<text x="90.00" y="1601.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">5. output_value[15:0] = actions[output_index] hanya bila done &amp;&amp; !fault &amp;&amp; !abort &amp;&amp; output_index&lt;3; selain itu nol.</text>
<text x="90.00" y="1627.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">6. busy/done/fault dan datapath adalah register; output mask kombinasi bergantung input. Bukan klaim seluruh core Moore murni.</text>
<text x="90.00" y="1653.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">7. 6.916 clock / 138,32 us @50 MHz; waktu ROM WAIT sudah termasuk. Diagram tidak menambah siklus baru.</text>
