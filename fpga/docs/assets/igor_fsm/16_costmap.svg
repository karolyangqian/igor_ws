<text x="90.00" y="1056.33" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: READY; valid=0; age=0xffffffff; bank0</text>
<text x="90.00" y="1082.33" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. Prioritas conflict &gt; begin_frame &gt; write_byte &gt; commit_frame; tanpa command register kontrol ditahan.</text>
<text x="90.00" y="1108.33" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. ram_wr=write_byte &amp;&amp; loading &amp;&amp; !fault &amp;&amp; !conflict &amp;&amp; count&lt;16384 &amp;&amp; frame_addr==count.</text>
<text x="90.00" y="1134.33" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. fresh=valid &amp;&amp; age&lt;FRESH_CYCLES. Kadaluarsa tidak otomatis mengganti loading/fault; gate tetap melihat fresh0.</text>
<text x="90.00" y="1160.33" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. valid lama tidak harus0 saat LOAD/FAULT; map_ok di top juga mensyaratkan !map_fault. Diagram bukan enum RTL.</text>
