<text x="90.00" y="983.08" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">SOURCE: rtl/igor_src_policy/igor_src_policy_uart.v</text>
<text x="90.00" y="1009.08" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: position=0; crc=0; invalid_observation=0</text>
<text x="90.00" y="1035.08" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. Setiap panah konsumsi byte hanya pada rx_valid=1, mode=RX, dan tidak dikalahkan prioritas reject/E-stop. Tanpa byte: fase ditahan.</text>
<text x="90.00" y="1061.08" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. payload_index=position-4; received_word={rx_data,low_byte}; urutan little-endian. LiDAR0..63:0..256; field64..73:-256..256.</text>
<text x="90.00" y="1087.08" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Parser global reset/reject mengembalikan position=0. Inter-byte timeout hanya ketika position!=0 dan tidak ada rx_valid.</text>
<text x="90.00" y="1113.08" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. Default case(position) di source berarti pemrosesan payload, bukan guard illegal-position tersendiri. Alias LOW/HIGH hanya menjelaskan rentang posisi legal.</text>
<text x="90.00" y="1139.08" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">5. CRC8 Maxim reflected 0x8C; opcode, length dan payload masuk CRC, dua header tidak. mode tidak menjadi LOAD sebelum CRC+domain sah.</text>
</svg>