<text x="90.00" y="1497.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. Default state: busy=done=0; fault=1; state=0. Fault sticky sampai reset; output dimask oleh fault dan weights_ready.</text>
<text x="90.00" y="1523.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. load_input salah atau start saat busy mengeset fault, tetapi source ini tidak memiliki global abort/fault-return seperti Parallel8; komputasi bisa berlanjut.</text>
<text x="90.00" y="1549.00" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Nama alias bukan enum RTL. Ini blok legacy terpisah; bukan core74input yang saat ini diprogram.</text>
