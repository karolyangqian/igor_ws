<text x="90.00" y="739.88" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">SOURCE: rtl/igor_config_registers.v</text>
<text x="90.00" y="765.88" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: EMPTY; seluruh batas0</text>
<text x="90.00" y="791.88" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. wr lebih diprioritaskan daripada lock_request; keduanya bersamaan ditolak. Validasi reserved bits dan rentang dilakukan sebelum simpan.</text>
<text x="90.00" y="817.88" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. Guard wr: !locked &amp;&amp; !busy &amp;&amp; !lock_request &amp;&amp; format/range sah. Tidak ada unlock selain reset.</text>
<text x="90.00" y="843.88" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. fault dapat tetap1 ketika write berikutnya mengubah valid/data jika belum locked; label FAULT berarti fault sticky, bukan semua register dibekukan.</text>
<text x="90.00" y="869.88" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. cfg_ok di top=cfg_valid &amp;&amp; locked &amp;&amp; !cfg_fault. Tidak ada state enum baru pada source.</text>
</svg>