<text x="850.00" y="92.00" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="white">ACUAN STRUKTUR THREE-PROCESS — BUKAN REFACTOR LIVE</text>
<text x="850.00" y="175.00" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">Model struktur rekomendasi, bukan nama state RTL  |  STRUCTURE: pembagian tugas kode untuk kandidat berikutnya</text>
<rect x="249.44560000000004" y="359.34" width="275.2488" height="88.92" rx="15" fill="#DDEAF7" stroke="#6E8950" stroke-width="2"/>
<text x="387.07" y="379.50" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">1. STATE REGISTER</text>
<text x="387.07" y="403.80" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">always @(posedge clk / reset)</text>
<text x="387.07" y="428.10" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">current_state &lt;= next_state</text>
<rect x="1153.55" y="348.83879999999994" width="297.0" height="109.9224" rx="15" fill="#E6F3CF" stroke="#6E8950" stroke-width="2"/>
<text x="1302.05" y="367.35" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">2. NEXT-STATE LOGIC</text>
<text x="1302.05" y="391.65" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">always @*</text>
<text x="1302.05" y="415.95" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">next_state=current_state; case +</text>
<text x="1302.05" y="440.25" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">default</text>
<rect x="786.4468" y="348.83879999999994" width="299.2464" height="109.9224" rx="15" fill="#E6F3CF" stroke="#6E8950" stroke-width="2"/>
<text x="936.07" y="367.35" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">3. OUTPUT LOGIC / REGISTER</text>
<text x="936.07" y="391.65" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">Decode state + input/datapath</text>
<text x="936.07" y="415.95" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">Pulse default0; output penting</text>
<text x="936.07" y="440.25" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172033">diregister</text>
