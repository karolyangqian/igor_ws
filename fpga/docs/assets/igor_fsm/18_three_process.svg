<text x="655.57" y="394.50" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172033">yang diperlukan</text>
<rect x="70" y="523.76" width="1560" height="278" rx="14" fill="#F2EDF7" stroke="#C2B1D3"/>
<text x="90.00" y="553.76" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">SOURCE: rtl/igor_src_policy/igor_src_policy_uart.v</text>
<text x="90.00" y="579.76" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">RESET: Lihat halaman FSM; halaman ini adalah struktur/overview.</text>
<text x="90.00" y="605.76" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">1. RTL core/policy sekarang menggabungkan state update, next-state dan register datapath dalam always clocked; ini gaya sequential yang sah.</text>
<text x="90.00" y="631.76" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">2. Moore: output=f(state). Mealy: output=f(state,input). Mealy yang diregister menunggu clock; tidak selalu berarti respons tanpa latensi.</text>
<text x="90.00" y="657.76" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">3. Moore decode kombinasi tidak otomatis bebas glitch. Registrasi output + CDC/reset yang benar menentukan kestabilan fisik.</text>
<text x="90.00" y="683.76" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">4. Assignment tidak lengkap dalam always @* dapat membentuk latch; tidak menulis register dalam always posedge berarti hold flip-flop.</text>
<text x="90.00" y="709.76" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">5. Default case membantu perilaku RTL ilegal; proteksi state fisik tetap perlu verifikasi encoding/safe-FSM di synthesis, bukan sekadar gambar.</text>
<text x="90.00" y="735.76" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">6. Enum/localparam bernama membantu review. Nilai state di halaman lain disalin dari source, bukan janji encoding hasil Fitter.</text>
<text x="90.00" y="761.76" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172033">7. Refactor three-process harus menjaga timing pulse, prioritas reject, nonblocking pipeline, oracle integer, safety, dan hasil build sebelum mengganti SOF.</text>
</svg>