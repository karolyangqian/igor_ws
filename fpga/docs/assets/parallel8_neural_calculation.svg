<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1500" viewBox="0 0 2080 1500">
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#2463db"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#7953b8"/></marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#00897b"/></marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#b27713"/></marker>
</defs>
<rect width="2080" height="1500" fill="#f5f8fc"/>
<rect x="0" width="2080" height="14" fill="#2463db"/>

<text x="80" y="68" font-family="Arial, sans-serif" font-size="22" fill="#2463db" font-weight="700" text-anchor="start" letter-spacing="3">IGOR  /  PARALLEL8</text>
<text x="80" y="132" font-family="Arial, sans-serif" font-size="48" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">Bagaimana satu neuron dihitung?</text>
<text x="80" y="179" font-family="Arial, sans-serif" font-size="25" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Ilustrasi RTL sederhana: kalikan input dengan bobot, jumlahkan, lalu terapkan aktivasi.</text>
<rect x="1660" y="58" width="340" height="125" rx="22" fill="#e6efff" stroke="#ccddfa" stroke-width="2"/>
<text x="1690" y="92" font-family="Arial, sans-serif" font-size="18" fill="#2463db" font-weight="700" text-anchor="start" letter-spacing="1">SATU UNIT PERHITUNGAN</text>
<text x="1690" y="143" font-family="Arial, sans-serif" font-size="37" fill="#2463db" font-weight="700" text-anchor="start" letter-spacing="0">1 neuron</text>
<text x="80" y="241" font-family="Arial, sans-serif" font-size="32" fill="#2463db" font-weight="700" text-anchor="start" letter-spacing="0">y[j] = aktivasi( bias[j] + Σ input[k] × bobot[j,k] )</text>
<path d="M420 570 H538" fill="none" stroke="#7953b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text x="480" y="530" font-family="Arial, sans-serif" font-size="19" fill="#7953b8" font-weight="600" text-anchor="middle" letter-spacing="0">input</text>
<text x="480" y="554" font-family="Arial, sans-serif" font-size="19" fill="#7953b8" font-weight="600" text-anchor="middle" letter-spacing="0">16-bit</text>
<path d="M890 570 H1008" fill="none" stroke="#2463db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="950" y="530" font-family="Arial, sans-serif" font-size="19" fill="#2463db" font-weight="600" text-anchor="middle" letter-spacing="0">product</text>
<text x="950" y="554" font-family="Arial, sans-serif" font-size="19" fill="#2463db" font-weight="600" text-anchor="middle" letter-spacing="0">32-bit</text>
<path d="M1440 570 H1538" fill="none" stroke="#2463db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="1490" y="530" font-family="Arial, sans-serif" font-size="19" fill="#2463db" font-weight="600" text-anchor="middle" letter-spacing="0">acc</text>
<text x="1490" y="554" font-family="Arial, sans-serif" font-size="19" fill="#2463db" font-weight="600" text-anchor="middle" letter-spacing="0">40-bit</text>
<path d="M720 405 V438" fill="none" stroke="#00897b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M1230 405 V438" fill="none" stroke="#b27713" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<path d="M1340 690 V748 H1120 V702" fill="none" stroke="#b27713" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<text x="1230" y="782" font-family="Arial, sans-serif" font-size="22" fill="#b27713" font-weight="600" text-anchor="middle" letter-spacing="0">Ulangi MAC untuk semua input k</text>
<path d="M1775 690 V728" fill="none" stroke="#2463db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="80" y="455" width="340" height="240" rx="22" fill="#e7edf5" stroke="#e7edf5" stroke-width="2"/>
<rect x="80" y="450" width="340" height="240" rx="22" fill="white" stroke="#d5dfec" stroke-width="2"/>
<g transform="translate(104,472) scale(0.8)" fill="none" stroke="#7953b8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5 V51 M28 5 V51 M46 5 V51"/><rect x="4" y="13" width="12" height="9" rx="2"/><rect x="22" y="32" width="12" height="9" rx="2"/><rect x="40" y="20" width="12" height="9" rx="2"/></g>
<text x="169" y="504" font-family="Arial, sans-serif" font-size="28" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">Input x[k]</text>
<text x="104" y="556" font-family="Consolas, monospace" font-size="18" fill="#7953b8" font-weight="600" text-anchor="start" letter-spacing="0">operand signed[15:0]</text>
<text x="104" y="600" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Ambil satu nilai input</text>
<text x="104" y="633" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Format Q8.8</text>
<text x="104" y="666" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Pilih indeks k</text>
<rect x="550" y="455" width="340" height="240" rx="22" fill="#e7edf5" stroke="#e7edf5" stroke-width="2"/>
<rect x="550" y="450" width="340" height="240" rx="22" fill="white" stroke="#d5dfec" stroke-width="2"/>
<g transform="translate(574,472) scale(0.8)" fill="none" stroke="#2463db" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="5" width="40" height="47" rx="7"/><path d="M17 17 H39 M18 29 L25 36 M25 29 L18 36 M33 32 H41 M37 28 V36 M17 44 H40"/></g>
<text x="639" y="504" font-family="Arial, sans-serif" font-size="28" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">Kalikan</text>
<text x="574" y="556" font-family="Consolas, monospace" font-size="18" fill="#2463db" font-weight="600" text-anchor="start" letter-spacing="0">product = input × bobot</text>
<text x="574" y="600" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Multiplier signed 16×16</text>
<text x="574" y="633" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Hasil perkalian: 32-bit</text>
<text x="574" y="666" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Satu product tiap langkah</text>
<rect x="1020" y="455" width="420" height="240" rx="22" fill="#e7edf5" stroke="#e7edf5" stroke-width="2"/>
<rect x="1020" y="450" width="420" height="240" rx="22" fill="white" stroke="#d5dfec" stroke-width="2"/>
<g transform="translate(1044,472) scale(0.8)" fill="none" stroke="#b27713" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="32" height="32" rx="5"/><rect x="22" y="22" width="12" height="12" rx="2"/><path d="M19 3 V12 M28 3 V12 M37 3 V12 M19 44 V53 M28 44 V53 M37 44 V53 M3 19 H12 M3 28 H12 M3 37 H12 M44 19 H53 M44 28 H53 M44 37 H53"/></g>
<text x="1109" y="504" font-family="Arial, sans-serif" font-size="28" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">Jumlahkan</text>
<text x="1044" y="556" font-family="Consolas, monospace" font-size="18" fill="#b27713" font-weight="600" text-anchor="start" letter-spacing="0">acc = acc + product</text>
<text x="1044" y="600" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Accumulator register 40-bit</text>
<text x="1044" y="633" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Product di-sign-extend</text>
<text x="1044" y="666" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Simpan jumlah sementara</text>
<rect x="1550" y="455" width="450" height="240" rx="22" fill="#e7edf5" stroke="#e7edf5" stroke-width="2"/>
<rect x="1550" y="450" width="450" height="240" rx="22" fill="white" stroke="#d5dfec" stroke-width="2"/>
<g transform="translate(1574,472) scale(0.8)" fill="none" stroke="#2463db" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="5" width="40" height="47" rx="7"/><path d="M17 17 H39 M18 29 L25 36 M25 29 L18 36 M33 32 H41 M37 28 V36 M17 44 H40"/></g>
<text x="1639" y="504" font-family="Arial, sans-serif" font-size="28" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">Aktivasi</text>
<text x="1574" y="556" font-family="Consolas, monospace" font-size="18" fill="#2463db" font-weight="600" text-anchor="start" letter-spacing="0">igor_src_policy_activation</text>
<text x="1574" y="600" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Turunkan skala: acc[39:8]</text>
<text x="1574" y="633" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Hidden: ReLU + saturasi</text>
<text x="1574" y="666" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Output: clamp −256…+256</text>
<rect x="550" y="290" width="340" height="115" rx="18" fill="#eaf4f1" stroke="#d5dfec" stroke-width="2"/>
<g transform="translate(570,315) scale(0.8)" fill="none" stroke="#00897b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="28" cy="10" rx="20" ry="7"/><path d="M8 10 V44 C8 54 48 54 48 44 V10 M8 26 C8 36 48 36 48 26 M8 42 C8 52 48 52 48 42"/></g>
<text x="632" y="332" font-family="Arial, sans-serif" font-size="25" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">Bobot w[j,k]</text>
<text x="570" y="378" font-family="Arial, sans-serif" font-size="21" fill="#00897b" font-weight="400" text-anchor="start" letter-spacing="0">Dibaca dari bank ROM</text>
<rect x="1020" y="290" width="420" height="115" rx="18" fill="#fff3df" stroke="#d5dfec" stroke-width="2"/>
<g transform="translate(1040,315) scale(0.8)" fill="none" stroke="#b27713" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="28" cy="10" rx="20" ry="7"/><path d="M8 10 V44 C8 54 48 54 48 44 V10 M8 26 C8 36 48 36 48 26 M8 42 C8 52 48 52 48 42"/></g>
<text x="1102" y="332" font-family="Arial, sans-serif" font-size="25" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">Mulai dari bias</text>
<text x="1040" y="378" font-family="Arial, sans-serif" font-size="21" fill="#b27713" font-weight="400" text-anchor="start" letter-spacing="0">acc awal = bias Q8.8 &lt;&lt; 8</text>
<rect x="1550" y="740" width="450" height="64" rx="16" fill="#e7efff" stroke="#d5dfec" stroke-width="2"/>
<text x="1775" y="781" font-family="Arial, sans-serif" font-size="25" fill="#2463db" font-weight="700" text-anchor="middle" letter-spacing="0">y[j]: hasil neuron 16-bit</text>
<text x="80" y="782" font-family="Arial, sans-serif" font-size="24" fill="#52667f" font-weight="600" text-anchor="start" letter-spacing="0">Di RTL: ADDRESS → WAIT → MAC</text>
<rect x="80" y="860" width="1920" height="235" rx="24" fill="white" stroke="#d5dfec" stroke-width="2"/>
<text x="110" y="906" font-family="Arial, sans-serif" font-size="21" fill="#00897b" font-weight="700" text-anchor="start" letter-spacing="1">CONTOH EDUKASI: SATU NEURON DENGAN DUA INPUT</text>
<text x="110" y="965" font-family="Arial, sans-serif" font-size="40" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">0,125  +  (0,5 × 0,5)  +  (1 × −0,25)  =  0,125</text>
<text x="110" y="1012" font-family="Arial, sans-serif" font-size="23" fill="#52667f" font-weight="400" text-anchor="start" letter-spacing="0">Bias + jumlah perkalian input dan bobot → hasil sebelum aktivasi.</text>
<text x="110" y="1061" font-family="Arial, sans-serif" font-size="26" fill="#00897b" font-weight="600" text-anchor="start" letter-spacing="0">ReLU mempertahankan 0,125. Jika jumlahnya negatif, ReLU menghasilkan 0.</text>
<text x="80" y="1167" font-family="Arial, sans-serif" font-size="22" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="1">PERHITUNGAN INI DIULANG UNTUK SETIAP NEURON PADA JARINGAN IGOR</text>
<rect x="80" y="1210" width="400" height="123" rx="20" fill="white" stroke="#d5dfec" stroke-width="2"/>
<g transform="translate(100,1240) scale(0.8)" fill="none" stroke="#7953b8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5 V51 M28 5 V51 M46 5 V51"/><rect x="4" y="13" width="12" height="9" rx="2"/><rect x="22" y="32" width="12" height="9" rx="2"/><rect x="40" y="20" width="12" height="9" rx="2"/></g>
<text x="169" y="1262" font-family="Arial, sans-serif" font-size="29" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">74 input</text>
<text x="169" y="1300" font-family="Arial, sans-serif" font-size="22" fill="#7953b8" font-weight="400" text-anchor="start" letter-spacing="0">observasi robot</text>
<rect x="620" y="1210" width="400" height="123" rx="20" fill="white" stroke="#d5dfec" stroke-width="2"/>
<g transform="translate(640,1240) scale(0.8)" fill="none" stroke="#2463db" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="32" height="32" rx="5"/><rect x="22" y="22" width="12" height="12" rx="2"/><path d="M19 3 V12 M28 3 V12 M37 3 V12 M19 44 V53 M28 44 V53 M37 44 V53 M3 19 H12 M3 28 H12 M3 37 H12 M44 19 H53 M44 28 H53 M44 37 H53"/></g>
<text x="709" y="1262" font-family="Arial, sans-serif" font-size="29" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">128 neuron</text>
<text x="709" y="1300" font-family="Arial, sans-serif" font-size="22" fill="#2463db" font-weight="400" text-anchor="start" letter-spacing="0">hidden 1 + ReLU</text>
<rect x="1160" y="1210" width="400" height="123" rx="20" fill="white" stroke="#d5dfec" stroke-width="2"/>
<g transform="translate(1180,1240) scale(0.8)" fill="none" stroke="#2463db" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="32" height="32" rx="5"/><rect x="22" y="22" width="12" height="12" rx="2"/><path d="M19 3 V12 M28 3 V12 M37 3 V12 M19 44 V53 M28 44 V53 M37 44 V53 M3 19 H12 M3 28 H12 M3 37 H12 M44 19 H53 M44 28 H53 M44 37 H53"/></g>
<text x="1249" y="1262" font-family="Arial, sans-serif" font-size="29" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">64 neuron</text>
<text x="1249" y="1300" font-family="Arial, sans-serif" font-size="22" fill="#2463db" font-weight="400" text-anchor="start" letter-spacing="0">hidden 2 + ReLU</text>
<rect x="1700" y="1210" width="300" height="123" rx="20" fill="white" stroke="#d5dfec" stroke-width="2"/>
<g transform="translate(1720,1240) scale(0.8)" fill="none" stroke="#00897b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5 V51 M28 5 V51 M46 5 V51"/><rect x="4" y="13" width="12" height="9" rx="2"/><rect x="22" y="32" width="12" height="9" rx="2"/><rect x="40" y="20" width="12" height="9" rx="2"/></g>
<text x="1789" y="1262" font-family="Arial, sans-serif" font-size="29" fill="#18314f" font-weight="700" text-anchor="start" letter-spacing="0">3 hasil</text>
<text x="1789" y="1300" font-family="Arial, sans-serif" font-size="22" fill="#00897b" font-weight="400" text-anchor="start" letter-spacing="0">residual + clamp</text>
<path d="M480 1272 H608" fill="none" stroke="#2463db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M1020 1272 H1148" fill="none" stroke="#2463db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M1560 1272 H1688" fill="none" stroke="#2463db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="80" y="1380" width="1920" height="77" rx="18" fill="#e7efff" stroke="#e7efff" stroke-width="2"/>
<text x="110" y="1429" font-family="Arial, sans-serif" font-size="27" fill="#2463db" font-weight="700" text-anchor="start" letter-spacing="0">Parallel8: 8 neuron dihitung bersama  •  Seluruh inferensi: 6.916 clock = 138,32 µs @ 50 MHz</text>
</svg>
