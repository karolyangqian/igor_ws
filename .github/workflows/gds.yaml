name: gds

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Stage Tiny Tapeout source directory
        run: |
          mkdir -p src
          cp -a src-chip/. src/
          test -f src/defines.vh

      - name: Build GDS
        timeout-minutes: 150
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

      - name: Preserve physical-flow diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gds-diagnostics-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            src/config*.json
            src/user_config*.json
            runs/wokwi/**/config*.json
            runs/wokwi/**/*.log
            runs/wokwi/**/*.rpt
            runs/wokwi/**/*.drc
            runs/wokwi/**/*.json
            runs/wokwi/**/*.json.original
            runs/wokwi/**/netgen_powered_netlist.v
            runs/wokwi/**/*.odb
            runs/wokwi/**/*.sdc
            runs/wokwi/**/*.guide

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
